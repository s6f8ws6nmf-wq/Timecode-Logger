name: TVArchivTV
options:
  bundleIdPrefix: local.tvarchiv
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.5.0"
    CURRENT_PROJECT_VERSION: "8"
targets:
  TVArchivTV:
    type: application
    platform: tvOS
    sources:
      - Sources
      - Resources
    dependencies:
      - target: TopShelf
    entitlements:
      path: Sources/TVArchiv.entitlements
      properties:
        com.apple.security.application-groups:
          - group.local.tvarchiv.player
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tvarchiv.player
        PRODUCT_NAME: "TV Archiv"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "TV Archív"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: sk
        UIUserInterfaceStyle: Dark
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        LSApplicationQueriesSchemes: [youtube]
        CFBundleURLTypes:
          - CFBundleURLName: local.tvarchiv.player
            CFBundleURLSchemes: [tvarchiv]
  TopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - TopShelf
      - path: Sources/Net.swift
      - path: Sources/Site.swift
    entitlements:
      path: TopShelf/TopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.local.tvarchiv.player
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tvarchiv.player.topshelf
        PRODUCT_NAME: TopShelf
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: "TV Archív Top Shelf"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ContentProvider"
