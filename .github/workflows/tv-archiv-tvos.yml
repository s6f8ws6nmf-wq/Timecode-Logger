name: TV Archív – tvOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "TVArchivTV/**"
      - ".github/workflows/tv-archiv-tvos.yml"

permissions:
  contents: write

concurrency:
  group: tvos-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Vybrať najnovší Xcode (tvOS 26 SDK kvôli Liquid Glass)
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: XcodeGen
        run: |
          brew install xcodegen
          cd TVArchivTV && xcodegen generate

      - name: Build (bez podpisu)
        run: |
          cd TVArchivTV
          xcodebuild -project TVArchivTV.xcodeproj -scheme TVArchivTV \
            -configuration Release -sdk appletvos -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Zabaliť IPA
        run: |
          cd TVArchivTV
          APP=$(find build/Build/Products/Release-appletvos -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          # ad-hoc podpis s entitlements (App Group pre Top Shelf) – Sideloadly ich prevezme pri prepodpise
          APPN=$(basename "$APP")
          for EXT in "Payload/$APPN"/PlugIns/*.appex; do
            [ -d "$EXT" ] && codesign -f -s - --entitlements TopShelf/TopShelf.entitlements "$EXT"
          done
          codesign -f -s - --entitlements Sources/TVArchiv.entitlements "Payload/$APPN"
          codesign -d --entitlements - "Payload/$APPN" || true
          ls "Payload/$APPN/PlugIns" || true
          # kontrola: doplnok musí mať CFBundlePackageType = XPC!
          for EXT in "Payload/$APPN"/PlugIns/*.appex; do
            T=$(/usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$EXT/Info.plist")
            echo "$EXT: $T"; [ "$T" = "XPC!" ] || { echo "Chýba XPC! v Info.plist doplnku"; exit 1; }
          done
          rm -f TV-Archiv-tvOS.ipa
          zip -qry TV-Archiv-tvOS.ipa Payload
          ls -la TV-Archiv-tvOS.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Archiv-tvOS
          path: TVArchivTV/TV-Archiv-tvOS.ipa

      - name: Uložiť IPA do repozitára (download/)
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          cp TVArchivTV/TV-Archiv-tvOS.ipa "$RUNNER_TEMP/app.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin "$BRANCH"
            git checkout -B publish "origin/$BRANCH"
            mkdir -p download
            rm -f download/HotelParadise-tvOS-unsigned.ipa
            cp "$RUNNER_TEMP/app.ipa" download/TV-Archiv-tvOS.ipa
            git add -A download/
            git diff --cached --quiet && exit 0
            git commit -m "TV Archív tvOS: nové IPA [skip ci]"
            git push origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          exit 1
